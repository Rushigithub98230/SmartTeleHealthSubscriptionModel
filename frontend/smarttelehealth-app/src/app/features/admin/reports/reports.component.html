<!-- Admin Reports Dashboard -->
<div class="reports-page">
  <div class="page-header bg-light py-4 mb-4">
    <div class="container-fluid">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h2 class="mb-0"><i class="bi bi-file-earmark-bar-graph"></i> Reports & Exports</h2>
          <p class="text-muted mb-0">Generate and export business reports</p>
        </div>
        <a routerLink="/webadmin/dashboard" class="btn btn-outline-secondary">
          <i class="bi bi-speedometer2 me-1"></i>Dashboard
        </a>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <!-- Report Configuration -->
    <div class="card mb-4">
      <div class="card-header bg-white">
        <h5 class="mb-0">Configure Report</h5>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Report Type</label>
            <select class="form-select" [(ngModel)]="reportType">
              <option *ngFor="let type of reportTypes" [value]="type.id">{{type.name}}</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" [(ngModel)]="startDate">
          </div>
          <div class="col-md-3">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" [(ngModel)]="endDate">
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-primary w-100" (click)="generateReport()" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
              <i *ngIf="!loading" class="bi bi-file-earmark-text me-1"></i>
              Generate
            </button>
          </div>
        </div>

        <!-- Export Options -->
        <div class="mt-4 pt-3 border-top">
          <label class="form-label">Export Options:</label>
          <div class="btn-group">
            <button class="btn btn-outline-success btn-sm" (click)="exportReport('csv')">
              <i class="bi bi-file-earmark-spreadsheet me-1"></i>Export CSV
            </button>
            <button class="btn btn-outline-danger btn-sm" (click)="exportReport('pdf')">
              <i class="bi bi-file-earmark-pdf me-1"></i>Export PDF
            </button>
            <button class="btn btn-outline-primary btn-sm" (click)="exportReport('excel')">
              <i class="bi bi-file-earmark-excel me-1"></i>Export Excel
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Report Cards -->
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card quick-report-card">
          <div class="card-body text-center">
            <i class="bi bi-cash-stack text-success fs-1 mb-3"></i>
            <h6>Revenue Report</h6>
            <p class="text-muted small mb-3">Breakdown of all revenue sources</p>
            <button class="btn btn-sm btn-outline-success" (click)="reportType='revenue'; generateReport()">
              Generate
            </button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card quick-report-card">
          <div class="card-body text-center">
            <i class="bi bi-receipt text-primary fs-1 mb-3"></i>
            <h6>Billing Report</h6>
            <p class="text-muted small mb-3">All billing transactions</p>
            <button class="btn btn-sm btn-outline-primary" (click)="reportType='billing'; generateReport()">
              Generate
            </button>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card quick-report-card">
          <div class="card-body text-center">
            <i class="bi bi-activity text-warning fs-1 mb-3"></i>
            <h6>Usage Report</h6>
            <p class="text-muted small mb-3">Privilege usage statistics</p>
            <button class="btn btn-sm btn-outline-warning" (click)="reportType='usage'; generateReport()">
              Generate
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
