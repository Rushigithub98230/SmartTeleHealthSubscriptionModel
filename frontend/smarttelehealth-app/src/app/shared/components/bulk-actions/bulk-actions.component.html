<!-- Bulk Actions Component -->
<div class="bulk-actions-container" *ngIf="selectedItems.length > 0">
  <!-- Selection Summary -->
  <div class="selection-summary">
    <div class="selection-info">
      <span class="selection-text">{{ getSelectionText() }}</span>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="onClearSelection()">
        <i class="bi bi-x"></i> Clear
      </button>
    </div>
    
    <!-- Select All Toggle -->
    <div class="select-all-toggle">
      <div class="form-check">
        <input 
          class="form-check-input" 
          type="checkbox" 
          [checked]="isAllSelected"
          (change)="onSelectAllChange($event.target.checked)"
          id="selectAll">
        <label class="form-check-label" for="selectAll">
          Select All
        </label>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="action-buttons">
    <div class="btn-group" role="group">
      <button 
        *ngFor="let action of availableActions"
        type="button" 
        [class]="getActionButtonClass(action)"
        [disabled]="isActionDisabled(action)"
        (click)="onActionClick(action)"
        [title]="action.description">
        <i [class]="action.icon"></i>
        {{ action.label }}
      </button>
    </div>
  </div>
</div>

<!-- Confirmation Modal -->
<div class="modal fade" [class.show]="showConfirmation" [style.display]="showConfirmation ? 'block' : 'none'" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ getConfirmationTitle() }}</h5>
        <button type="button" class="btn-close" (click)="onCancelAction()"></button>
      </div>
      <div class="modal-body">
        <p>{{ getConfirmationMessage() }}</p>
        
        <!-- Reason Input -->
        <div class="mb-3" *ngIf="isReasonRequired()">
          <label class="form-label">Reason (Required)</label>
          <textarea 
            class="form-control" 
            [(ngModel)]="actionReason"
            placeholder="Please provide a reason for this action..."
            rows="3">
          </textarea>
        </div>

        <!-- Additional Input -->
        <div class="mb-3" *ngIf="isInputRequired()">
          <label class="form-label">{{ getInputLabel() }} (Required)</label>
          <input 
            type="{{ getInputType() }}" 
            class="form-control" 
            [(ngModel)]="actionReason"
            [placeholder]="'Enter ' + getInputLabel().toLowerCase()">
        </div>

        <!-- Impact Summary -->
        <div class="alert alert-info">
          <h6><i class="bi bi-info-circle"></i> Impact Summary</h6>
          <ul class="mb-0">
            <li>{{ getSelectedCount() }} subscription(s) will be affected</li>
            <li>Users will receive email notifications</li>
            <li>This action can be reversed if needed</li>
          </ul>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancelAction()">
          Cancel
        </button>
        <button 
          type="button" 
          class="btn btn-primary" 
          [disabled]="!canExecuteAction() || isLoading"
          (click)="onConfirmAction()">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2"></span>
          Confirm Action
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Backdrop -->
<div class="modal-backdrop fade" [class.show]="showConfirmation" *ngIf="showConfirmation"></div>
