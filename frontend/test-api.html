<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Testing Backend API Connectivity</h1>
    <div id="results"></div>
    
    <script>
        const apiUrl = 'http://localhost:61376/api';
        
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            
            try {
                // Test Categories API
                console.log('Testing Categories API...');
                const categoriesResponse = await fetch(`${apiUrl}/categories`);
                const categoriesData = await categoriesResponse.json();
                console.log('Categories API Response:', categoriesData);
                
                resultsDiv.innerHTML += `
                    <h2>Categories API Test</h2>
                    <p><strong>Status:</strong> ${categoriesResponse.status}</p>
                    <p><strong>Response:</strong> <pre>${JSON.stringify(categoriesData, null, 2)}</pre></p>
                `;
                
                // Test Subscription Plans API
                console.log('Testing Subscription Plans API...');
                const plansResponse = await fetch(`${apiUrl}/subscriptionplans/active`);
                const plansData = await plansResponse.json();
                console.log('Plans API Response:', plansData);
                
                resultsDiv.innerHTML += `
                    <h2>Subscription Plans API Test</h2>
                    <p><strong>Status:</strong> ${plansResponse.status}</p>
                    <p><strong>Response:</strong> <pre>${JSON.stringify(plansData, null, 2)}</pre></p>
                `;
                
            } catch (error) {
                console.error('API Test Error:', error);
                resultsDiv.innerHTML += `<p style="color: red;"><strong>Error:</strong> ${error.message}</p>`;
            }
        }
        
        // Run test when page loads
        testAPI();
    </script>
</body>
</html>
