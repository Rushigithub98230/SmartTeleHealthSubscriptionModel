<header class="header">
  <div class="container">
    <div class="header-content">
      <!-- Logo -->
      <div class="logo" (click)="onHome()">
        <h2>SmartTeleHealth</h2>
      </div>

      <!-- Navigation -->
      <nav class="nav">
        <a href="#home" class="nav-link">Home</a>
        <a href="#plans" class="nav-link">Plans</a>
        <a href="#about" class="nav-link">About</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>

      <!-- Auth Actions -->
      <div class="auth-actions">
        <!-- Not Authenticated -->
        <div *ngIf="!(isAuthenticated$ | async)" class="auth-buttons">
          <button class="btn btn-outline" (click)="onLogin()">Login</button>
          <button class="btn btn-primary" (click)="onSignup()">Sign Up</button>
        </div>

        <!-- Authenticated -->
        <div *ngIf="isAuthenticated$ | async" class="user-menu">
          <div class="user-info">
            <span class="user-name">{{ (currentUser$ | async)?.firstName }} {{ (currentUser$ | async)?.lastName }}</span>
            <span class="user-role">{{ (currentUser$ | async)?.role }}</span>
          </div>
          <div class="user-actions">
            <button class="btn btn-outline" (click)="onAdminPortal()" *ngIf="(currentUser$ | async)?.role === 'Admin'">
              Admin Portal
            </button>
            <button class="btn btn-outline" (click)="onLogout()">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
